name: Continuous Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify application and contracts
        working-directory: backend
        run: mvn --batch-mode verify
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:main

  canary-deploy:
    needs: verify-and-publish
    if: ${{ vars.CD_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH access
        shell: bash
        env:
          CD_HOST: ${{ secrets.CD_HOST }}
          CD_USER: ${{ secrets.CD_USER }}
          CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          CD_KNOWN_HOSTS: ${{ secrets.CD_KNOWN_HOSTS }}
        run: |
          test -n "$CD_HOST" && test -n "$CD_USER" && test -n "$CD_SSH_KEY" && test -n "$CD_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$CD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "CD_HOST=$CD_HOST" >> "$GITHUB_ENV"
          echo "CD_USER=$CD_USER" >> "$GITHUB_ENV"
      - name: Copy canary configuration to host
        run: |
          ssh "$CD_USER@$CD_HOST" 'mkdir -p /opt/ci-dashboard/ops/nginx'
          scp docker-compose.cd.yml "$CD_USER@$CD_HOST:/opt/ci-dashboard/docker-compose.cd.yml"
          scp ops/nginx/canary.conf.template "$CD_USER@$CD_HOST:/opt/ci-dashboard/ops/nginx/canary.conf.template"
      - name: Canary deploy, smoke check, promote or roll back
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.verify-and-publish.outputs.image }}:${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$CD_USER@$CD_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh "$CD_USER@$CD_HOST" bash -s -- "$IMAGE" <<'REMOTE'
          set -euo pipefail
          cd /opt/ci-dashboard
          candidate="$1"
          stable="$(cat .stable-image 2>/dev/null || printf '%s' "$candidate")"
          export STABLE_IMAGE="$stable" CANARY_IMAGE="$candidate"
          export STABLE_VERSION="${stable##*:}" CANARY_VERSION="${candidate##*:}"
          export STABLE_WEIGHT=90 CANARY_WEIGHT=10
          rollback() {
            echo 'Deployment step failed; restoring stable traffic.'
            STABLE_WEIGHT=1000 CANARY_WEIGHT=1 docker compose -f docker-compose.cd.yml up -d --no-deps --wait canary-gateway || true
          }
          trap rollback ERR
          docker compose -f docker-compose.cd.yml pull
          docker compose -f docker-compose.cd.yml up -d --wait
          curl -fsS http://127.0.0.1:18080/actuator/health >/dev/null
          curl -fsS http://127.0.0.1:18081/actuator/health >/dev/null
          curl -fsS http://127.0.0.1:8180/actuator/health >/dev/null
          canary_seen=false
          for attempt in {1..50}; do
            if curl -fsS http://127.0.0.1:8180/api/deployment/instance | grep -q '"slot":"canary"'; then canary_seen=true; break; fi
          done
          if [ "$canary_seen" != true ]; then
            echo 'Canary smoke check failed; restoring stable traffic.'
            STABLE_WEIGHT=1000 CANARY_WEIGHT=1 docker compose -f docker-compose.cd.yml up -d --no-deps --wait canary-gateway
            exit 1
          fi
          STABLE_WEIGHT=1 CANARY_WEIGHT=1000 docker compose -f docker-compose.cd.yml up -d --no-deps --wait canary-gateway
          if ! curl -fsS http://127.0.0.1:8180/api/deployment/instance | grep -q '"slot":"canary"'; then
            echo 'Promotion check failed; rolling back to stable.'
            STABLE_WEIGHT=1000 CANARY_WEIGHT=1 docker compose -f docker-compose.cd.yml up -d --no-deps --wait canary-gateway
            exit 1
          fi
          printf '%s' "$candidate" > .stable-image
          trap - ERR
          echo "Canary $candidate promoted after health checks."
          REMOTE
