services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on: [backend]
